<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Dashboard Incidencias</title>
    <style>
        html, body, body > div, #content { height: 100%; }
    </style>
    <script
        id="sap-ui-bootstrap"
        src="https://ui5.sap.com/1.147.2/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resource-roots='{"dashboard": "./"}'
        data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compat-version="edge"
        data-sap-ui-async="true"
        data-sap-ui-frame-options="trusted"
        data-sap-ui-preload=""
        data-sap-ui-libs="sap.m,sap.ui.core,sap.viz,sap.ui.layout"
    ></script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
    <div
        data-sap-ui-component
        data-name="dashboard"
        data-id="container"
        data-settings='{"id": "dashboard"}'
        data-handle-validation="true"
    >
    <a href="/" style="position:fixed; bottom:24px; left:24px; background:#0a6ed1; color:white; padding:10px 18px; border-radius:6px; font-size:13px; text-decoration:none; font-family:Arial,sans-serif; z-index:9999; box-shadow:0 2px 8px rgba(0,0,0,0.2);">← Inicio</a>
</body>
</html>
