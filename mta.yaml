_schema-version: 3.3.0
ID: tfg-ia
description: A simple CAP project.
version: 1.0.0
modules:
  - name: tfg-ia-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: tfg-ia-db
      - name: tfg-ia-auth
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
    build-parameters:
      builder: npm-ci
  - name: tfg-ia-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: tfg-ia-db
    parameters:
      buildpack: nodejs_buildpack
  - name: tfg-ia-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: tfg-ia-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - tfgiacreateincidence.zip
          name: tfgiacreateincidence
          target-path: resources/
        - artifacts:
            - greetingui.zip
          name: greetingui
          target-path: resources/
        - artifacts:
            - dashboard.zip
          name: dashboard
          target-path: resources/
  - name: tfgiacreateincidence
    type: html5
    path: app/createincidence
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []
  - name: greetingui
    type: html5
    path: app/greeting-ui
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []
  - name: dashboard
    type: html5
    path: app/dashboard
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []
  - name: tfg-ia
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: tfg-ia-auth
      - name: tfg-ia-html5-service-rt
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}
resources:
  - name: tfg-ia-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: tfg-ia-auth
    type: org.cloudfoundry.managed-service
    parameters:
      path: ./xs-security.json
      service: xsuaa
      service-plan: application
  - name: tfg-ia-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: tfg-ia-html5-service
      service-plan: app-host
  - name: tfg-ia-html5-service-rt
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
  - name: tfg-ia-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: false
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
              - Authentication: NoAuthentication
                HTML5.DynamicDestination: true
                HTML5.ForwardAuthToken: true
                Name: srv-api
                ProxyType: Internet
                Type: HTTP
                URL: ~{srv-api/srv-url}
            existing_destinations_policy: update
        version: 1.0.0
      service: destination
      service-name: tfg-ia-destination-service
      service-plan: lite
    requires:
      - name: srv-api
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production